<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>수업 실습: 배열 메서드 활용</title>
    <style>
      .table1 {
        width: 300px;
        border: 1px solid black;
        text-align: center;
        border-collapse: collapse;
        margin-top: 10px;
      }
      .table1 th {
        border: 1px solid black;
        background-color: chocolate;
        color: white;
        padding: 5px;
      }
      .table1 td {
        border: 1px solid black;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <select id="drinkList1"></select>
    <select id="drinkList2"></select>

    <button onclick="doSearch1()">조회1 (문자열 더하기)</button>
    <button onclick="doSearch2()">조회2 (배열 push, join)</button>

    <table class="table1">
      <thead>
        <tr>
          <th>학번</th>
          <th>이름</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>2201</td>
          <td>강태인</td>
        </tr>
        <tr>
          <td>2202</td>
          <td>김세부</td>
        </tr>
        <tr>
          <td>2203</td>
          <td>김하진</td>
        </tr>
      </tbody>
    </table>

    <table class="table1">
      <thead>
        <tr>
          <th>음료수</th>
          <th>가격</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>

    <table class="table1">
      <thead>
        <th>이름</th>
        <th>이메일</th>
      </thead>

      <tbody id="user"></tbody>
    </table>

    <script>
      // ********** 자바스크립트에서 가장 많이 사용하는 내장 객체 (배열) **********
      let brands = ['애플', '구글', '아마존', '마이크로소프트', '메타'];

      // 1. toString() : 쉼표(,)를 기준으로 하나의 문자열로 합치기
      console.log(brands.toString()); // 결과: 애플,구글,아마존,마이크로소프트,메타

      // 2. join() : 파라미터로 전달된 문자를 기점으로 하나의 문자열로 변환
      console.log(brands.join('')); // 결과: 애플구글아마존마이크로소프트메타
      console.log(brands.join('**')); // 결과: 애플**구글**아마존**마이크로소프트**메타

      // 2-1. join()의 실무 활용 패턴 비교

      // [조회 방식 1] += 기호를 사용하여 문자열을 계속 이어 붙이는 옛날 방식
      const doSearch1 = () => {
        const drinkList = [
          { name: '오렌지', price: 1000 },
          { name: '파워에이드', price: 1200 },
          { name: '커피', price: 700 },
          { name: '보리음료', price: 1200 },
          { name: '코카콜라', price: 1800 },
        ];

        let trTags = '';
        for (let drink of drinkList) {
          trTags += '<tr>';
          trTags += '<td>' + drink.name + '</td>';
          trTags += '<td>' + drink.price + '</td>';
          trTags += '</tr>';
        }

        console.log(trTags);
        document.getElementById('tbody').innerHTML = trTags;
      };

      // [조회 방식 2] 빈 배열에 push()로 쌓은 뒤 join("")으로 한 번에 묶어 가독성을 높인 방식
      const doSearch2 = () => {
        const drinkList = [
          { name: '오렌지', price: 1000 },
          { name: '파워에이드', price: 1200 },
          { name: '커피', price: 700 },
          { name: '보리음료', price: 1200 },
          { name: '코카콜라', price: 1800 },
        ];

        let tags = [];

        for (let drink of drinkList) {
          tags.push('<tr>' + '<td>' + drink.name + '</td>' + '<td>' + drink.price + '</td>' + '</tr>');
        }

        document.getElementById('tbody').innerHTML = tags.join('');
      };

      // ********** 기타 주요 배열 메서드 정리 **********
      brands = ['애플', '구글', '아마존', '마이크로소프트', '메타'];

      // 3. push() : 배열의 맨 마지막 칸에 새로운 요소를 추가
      brands.push('테슬라');
      console.log(brands);

      // 4. pop() : 배열의 맨 마지막 칸 요소를 탈락시키고 제거
      brands.pop();
      console.log(brands);

      // 5. shift() : 배열의 첫 번째(0번칸) 요소를 밖으로 반환하고 목록에서 제거 (이벤트 큐 등 실무 활용)
      console.log(brands.shift()); // '애플' 출력 및 삭제
      console.log(brands[0]); // 이제 첫 번째 칸은 '구글'이 됨

      // 6. unshift() : 배열의 맨 앞(0번칸)에 새로운 요소를 새치기하듯 추가
      console.log(brands.unshift('삼성')); // 추가 후 총 배열의 길이(5)를 반환

      // ********** unshift()를 활용한 실무 드롭다운 박스 제어 예제 **********

      // 예제 A: 고정된 데이터를 맨 앞에 추가하는 형태
      const drinkListFunc = () => {
        const types = [
          { text: '커피', code: 'A' },
          { text: '콜라', code: 'B' },
          { text: '이온음료', code: 'C' },
        ];

        // 기본 음료 목록 맨 앞에 '물'을 기본값으로 슬쩍 끼워넣기
        types.unshift({ text: '물', code: 'D' });

        let tags = [];
        for (let type of types) {
          tags.push("<option value='" + type.code + "'>" + type.text + '</option>');
        }
        return tags;
      };

      const selDrinkType = drinkListFunc();
      document.getElementById('drinkList1').innerHTML = selDrinkType.join('');

      // 예제 B: 넣고 싶은 대상을 매개변수(Object 파라미터)로 받아서 유연하게 추가하는 형태
      const drinkListFunc3 = ({ text, code } = {}) => {
        const types = [
          { text: '커피', code: 'A' },
          { text: '콜라', code: 'B' },
          { text: '이온음료', code: 'C' },
        ];

        let tags = [];

        // 인자값으로 외부에서 데이터가 들어온 경우에만 맨 앞에 새치기(unshift) 실행
        if (text) {
          types.unshift({ text: text, code: code });
        }

        for (let type of types) {
          tags.push("<option value='" + type.code + "'>" + type.text + '</option>');
        }
        return tags;
      };

      // 함수를 호출할 때 "사이다"를 전달하면 목록 맨 위에 사이다가 잡힘
      const selDrinkType2 = drinkListFunc3({ text: '사이다', code: 'E' });
      document.getElementById('drinkList2').innerHTML = selDrinkType2.join('');

      // 7. concat() : 두 개 이상의 배열을 하나로 합쳐서 배열로 리턴
      let arr1 = ['강태인', '김세부', '김하진'];
      let arr2 = ['박경은', '박순호'];
      let arr3 = ['신홍명', '안지호', '이여설'];
      let arr4 = arr1.concat(arr2);
      console.log(arr4); // ['강태인', '김세부', '김하진', '박경은', '박순호']
      let arr5 = arr1.concat(arr2, arr3);
      console.log(arr5); // ['강태인', '김세부', '김하진', '박경은', '박순호', '신홍명', '안지호', '이여설']

      // ****spread operator(전개 연산자)
      let arr6 = [...arr1, ...arr2, ...arr3]; // 무조건 .(점)은 세개여야한다.
      console.log(arr6); // ['강태인', '김세부', '김하진', '박경은', '박순호', '신홍명', '안지호', '이여설']

      // 8. slice(start, end) : 배열을 잘라서 배열로 리턴, 원배열은...
      console.log(arr5.slice(1, 4)); // ['김세부', '김하진', '박경은']
      console.log(arr5); //['강태인', '김세부', '김하진', '박경은', '박순호', '신홍명', '안지호', '이여설'] => 원배열은 변하지 않는다.

      // 9. sort() : 배열의 요소를 정렬 ( 기본 : 문자열 오름차순 )
      brands = ['애플', '구글', '아마존', '마이크로소프트', '메타'];
      console.log(brands.sort()); // ['구글', '마이크로소프트', '메타', '아마존', '애플'] => 오름차순으로 정리

      let points = [85, 95, 100, 89, 98];
      console.log(points.sort()); // [100, 85, 89, 95, 98] => 숫자를 문자로 인식 따라서 숫자를 sort할 경우 별도의 브라우져 엔진 알고리즘이 필요

      /* 자바스크림트의 비교 함수의 동작원리 => 엔진이 내부적으로 알고리즘(크롬의 경우 TimSort알고리즘)을 갖고 있으며 함수 매개변수를 사용한다.
      반환값에 따라 다음과 같이 동작한다.

      ******
      if(a > b) return 1; // 양수이면 자리를 바꾼다.
      else if(a < b) return -1; // 음수이면 자리를 바꾸지 않는다.
      else 0; // 순서를 바꾸지 않는다. => 3줄을 한 줄로 압축을 하면 return a-b 이렇게 된다. */

      const ascPoints = points.sort(function (a, b) {
        // if (a > b) return 1;
        // else if (a < b) return -1;
        // else 0;
        return a - b;
      });
      console.log(ascPoints); // [85, 89, 95, 98, 100]

      const descPoints = points.sort(function (a, b) {
        return b - a;
      });
      console.log(ascPoints); // [100, 98, 95, 89, 85] => 내림차순

      // 9. sort()과제
      let drinkList = [
        { name: '오렌지', price: 1000 },
        { name: '파워에이드', price: 1200 },
        { name: '커피', price: 700 },
        { name: '보리음료', price: 1200 },
        { name: '코카콜라', price: 1800 },
      ];

      // 9-1. 이름순으로 오름차순 정렬
      // const ascDrink = drinkList.sort((a, b) => {
      // if(a["name"] > b["name"]) return 1;
      //     else if (a["name"] < b["name"]) return -1;
      //   else return 0;
      // });
      // console.log(ascDrink);

      // 9-2. 가격 내림차순 정렬
      // const descDrink = drinkList.sort((a, b) => {
      //   return b.price - a.price;
      // });
      // console.log(descDrink);

      // 9-3. 정렬기준을 입력 => 정렬(오름차순)
      // const selectKey = prompt();
      // const ascDrink = drinkList.sort((a, b) => {
      //   if (a["selectKey"] > b["selectKey"]) return 1;
      //   else if (a["selectKey"] < b["selectKey"]) return -1;
      //   else return 0;
      // });
      // console.log(ascDrink);

      // 10. splice(p1, p2, p3) : 배열의 특정 위치에 요소를 추가하거나, 제거가 가능, 배열의 변화
      // p1 : 추가할 자리의 인덱스
      // p2 : 제거할 갯수
      // p3 : 추가할 요소
      brands = ['애플', '구글', '아마존', '마이크로소프트', '메타'];
      brands.splice(1, 0, '삼성', '쿠팡');
      console.log(brands); // ['애플', '삼성', '쿠팡', '구글', '아마존', '마이크로소프트', '메타']
      brands.splice(1, 2);
      console.log(brands); // ['애플', '구글', '아마존', '마이크로소프트', '메타']

      // 구글 앞에 "삼성", "쿠팡"을 삽입
      brands.splice(brands.indexOf('구글'), 0, '삼성', '쿠팡');
      console.log(brands);

      /* 11. filter() ****************************
      - 배열의 특정 조건에는 맞는 요소만 리턴
      - 새로운 배열의 형태로 리턴
      형식 : 
      const resultArray = 원array.filter(() => {

      return .....
      })
      - 원 배열은 그대로 유지한다. */

      drinkList = [
        { name: '오렌지', price: 1000 },
        { name: '파워에이드', price: 1200 },
        { name: '커피', price: 700 },
        { name: '보리음료', price: 1200 },
        { name: '코카콜라', price: 1800 },
      ];
      // 11-1. for : 1000원으로 구입가능한 음료를 구하라
      let canBuy = [];
      for (const drink of drinkList) {
        if (drink.price <= 1000) {
          canBuy.push(drink);
        }
      }
      console.log(canBuy);

      // 11-2. filter
      let available = drinkList.filter((drink) => {
        return drink.price <= 1000;
      });
      console.log(available);

      // 11-3. ********* filter 실무예제 *********
      // 사용자가 카테고리를 선택하고, 특정가격 이하의 상품만 보겠다고 체크했을 때
      // 프론트엔드에서 데이터를 거르고자 하는 겨우
      let products = [
        { id: 1, name: '맥북프로', category: 'electronics', price: 2500000 },
        {
          id: 2,
          name: '아이패드 에어',
          category: 'electronics',
          price: 900000,
        },
        {
          id: 3,
          name: '기계식 키보드',
          category: 'accessories',
          price: 150000,
        },
        { id: 4, name: '허브 매트', category: 'accessories', price: 30000 },
      ];
      // 11-3-1. 카테고리가 악세서리인 것을 골라라
      let fashion = products.filter((item) => {
        return item === 'accessories'; // === 3개가 안전
      });
      console.log(fashion);
      // 11-3-2. 가격이 10만원 이하인 것을 골라라
      let price = products.filter((item) => {
        return item.price <= 100000;
      });
      console.log(price);
      // 11-3-3. 카테고리가 악세사리이고 가격이 10만원 이하인 것을 골라라
      let fashionCategory = products.filter((item) => {
        return item.category === 'accessories' && item.price <= 100000;
      });
      console.log(fashionCategory);

      // 12. map() : 배열의 모든 요소에 대해서 실행하고 새로운 배열의 형태로 리턴, 원배열은 그대로....
      // 과제 => map()을 이용해 firstName과 lastName을 합쳐 fullName, email을 새로운 객체 newUserList를 생성하시오
      let userList = [
        {
          firstName: '재석',
          lastName: '유',
          email: 'you@gmail.com',
        },
        {
          firstName: '종국',
          lastName: '김',
          email: 'kim@gmail.com',
        },
        {
          firstName: '지효',
          lastName: '송',
          email: 'song@gmail.com',
        },
      ];

      let newUserList = userList.map((user) => {
        return {
          fullName: user.lastName + user.firstName,
          email: user.email,
        };
      });

      console.log(newUserList);

      // 실무활동 : push(), join()대체
      // newUserList를 표(id = "user")로 나타내시오. (map 사용)
      let List = newUserList.map((user) => {
        return '<tr>' + '<td>' + user.fullName + '</td>' + '<td>' + user.email + '</td>' + '</tr>';
      });
      document.getElementById('user').innerHTML = List.join('');

      // 13. reduce(p1, p2, p3, p4) : 배열의 누적합
      // 또는 특정한 조건에 해당하는 값만 추출하는 함수
      // p1 : accumulator => 누적값
      // p2 : currentValue => 현재값
      // p3 : currentIndex => 현재 배열 인덱스, 생략 가능
      // p4 : arr => 전체 배열, 생략 가능
      /* 누적합 형식
        배열.reduce((누적값, 현재값, 인덱스, 원본배열) => {
            return 다음 누산기에 넘겨줄 값
          }, 초기값)
      */
      points = [89, 45, 78, 95, 100];
      // let sum = 0;
      // for (point of points) {
      //   sum += point;
      // }
      // console.log(sum); // 407

      sum = points.reduce((sum, i) => {
        sum += i;
        return sum;
      }, 0); // 초기값이 중요
      console.log(sum); // 407

      products = [
        { id: 1, name: '맥북프로', category: 'electronics', price: 2500000 },
        {
          id: 2,
          name: '아이패드 에어',
          category: 'electronics',
          price: 900000,
        },
        {
          id: 3,
          name: '기계식 키보드',
          category: 'accessories',
          price: 150000,
        },
        { id: 4, name: '허브 매트', category: 'accessories', price: 30000 },
      ];

      let sumOfPrice = products.reduce((sumOfPrice, item) => {
        sumOfPrice += item.price;
        return sumOfPrice;
      }, 0);
      console.log(sumOfPrice); // 3580000

    </script>
  </body>
</html>
