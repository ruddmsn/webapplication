<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /* 실무 예제 : 온라인 쇼핑몰 장바구니 관리
         쇼핑몰 웹사이트를 만들 때 장바구니는 아래 기능이 반드시 필요합니다.
         1. 상품 담기 (추가)
         2. 이미 담긴 상품인지 확인하고 수량 늘리기 (조회 및 수정)
         3. 상품 빼기 (삭제)
         4. 장바구니에 총 몇 종류의 상품이 있는지 확인 (개수 파악) */

      /* 개발자들은 object나 set보다 map을 선호할까요?
      1. 갯수 구하기 쉽다 : size속성 지원
      2. 연산 속도 빠르다.
      3. key어떤 값이던 올 수 있다. */

      const myCart = new Map();
      // 이미 장바구니에 들어있는 데이터
      myCart.set("product_01", {
        name: "무선 헤드셋",
        price: 100000,
        quantity: 1,
      });
      myCart.set("product_02", {
        name: "립글로스",
        price: 30000,
        quantity: 5,
      });

      // 1. 장바구니 출력
      for (const [productId, productValue] of myCart) {
        console.log(`${productValue.name} : ${productValue.quantity}`);
      }

      // 사용자로부터 추가하라고 입력 들어옴
      const userInput = "product_01";
      // 장바구니에 있는지 확인 후 처리 => 있다면 또 살거야? quantity증가
      //                               없다면 장바구니 추가
      if (myCart.has(userInput)) {
        if (prompt("또 사시겠습니다.?")) myCart.get(userInput).quantity++;
      } else {
        myCart.set(userInput);
      }
      myCart.forEach((value, key) => {
        console.log(
          `${myCart.get(userInput).name} : ${myCart.get(userInput).quantity}`,
        );
      });
    </script>
  </body>
</html>
