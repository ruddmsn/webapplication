<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /* for ~ of : 
        - 일반 배열에서 많이 사용(순회)
        - 문자열을 분해해서 사용 */

      // 1. 일단 배열
      let brands = ["애플", "구글", "삼성", "마이크로소프트", "테슬라"];
      for (const brand of brands) {
        // of뒤에는 대상이 오면 된다.
        console.log(brand);
      }

      // 2. 문자열 분해
      const lang = "javascript";
      for (const char of lang) {
        console.log(char);
      }

      // 3. 다음 숫자를 한 글자씩 분해
      let num = 1297857283590;
      console.log(typeof num);
    
      let numString = num.toString();
      console.log(typeof numString);

      for (const n of numString) {
        console.log(n);
      }
    </script>
  </body>
</html>
