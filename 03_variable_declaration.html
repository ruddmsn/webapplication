<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>자바스크립트의 변수</title>
  </head>
  <body>
    <script>
      /* 변수 선언의 종류
        1. var
        - ES6이전부터 사용
        - 재선언, 재할당이 가능 => 덮어쓰기 => 팀작업시 유의
        - 전역변수(전역변수란 어디에서든 사용가능) => 일반적으로 추천하지 않는다.*/

      var studentName = "2학년 2반";
      console.log(studentName);
      // studentNumber = 2201;
      studentName = "나미림";
      console.log(studentName); // 재활당 가능
      var studentName = "2학년 3반";
      console.log(studentName);
      var meister_code = "aab345"; // 권장하지 않는다.

      var x = 6;
      var y = 5;
      var z = x + y;
      console.log("z : ", z);

      var x = 9;
      y = 14;
      z = x - y;
      console.log("z : ", z);

      /* 2. let
            - ES6이후부터 사용
            - 재선언 불가
            - 재할당 가능
            - 권장 */
      //   let x = 9; 재선언 불가(예외Exception 발생)
      let x1 = 9;
      // let x1 = 9; 재선언 불가, syntax 오류
      x1 = 11; // 재할당 가능
      let y1 = 30;
      let z1 = x1 + y1;
      console.log("z1 : ", z1);
      z1 = x1 - y1; // 재할당 가능
      console.log("z1 : ", z1);

      /* 
      3. const
      - ES6이후 등장
      - 변하지 않는 상수값에 사용
      - 재선언, 재할당 불가
      - 대문자로 작성
      - 현업에서의 활용?
      */
      const PI = 3.14;
      //  const PI = 3; // 재선언 불가
      //  PI = 3; // 재할당 불가
      const KoreaDateFormat = "YYYY.MM.DD";
      const UsaDateFormat = "DD.MM.YYYY";

      /* 카멜 표기법(camelCase) : 두 가지 이상의 단어가 합쳐질 경우, 두 번째부터 단어의 첫 글자를 대문자로(가장 많이 사용)
        ex) var userName = 'John Doe' 
        스네이크 표기법(snake*case) : 두 개 이상의 단어가 합쳐질 경우 단어 사이에_삽입(파이썬에서 주로 사용)
        ex) var user_name = 'John Doe'
        파스칼 표기법(PascalCase) : 모든 단어의 첫 글자를 대문자로
        ex) var UserName = 'John Doe'
        헝가리안 표기법 : 변수명 맨 앞에 데이터의 타입에 해당하는 영어단어를 추가하고, 나머지는 카멜 표기법을 따른다.(많이 사용하지 X)
        ex) var strUserName = "John Doe" */

      /* 컴퓨터는 사칙연산(+, -, *, /)을 단일연산(+)으로 실제 실행
        - : 보수를 더한다. * : 덧셈반복 / : 보수덧셈 반복 */
    </script>
  </body>
</html>
