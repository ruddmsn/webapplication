<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /* 배열
        - 하나 이상의 데이터를 담을 수 있다.
        - 어떤 데이터 타입도 올 수 있다.
        - 어떤 데이터 타입도 함께 올 수 있다.
        - 인덱스가 있어서 순서가 있어 변하지 않는다. => 0
        -  */
      let nums = [1, 3, 5, 6, 7, 89]; // 숫자
      let str = ["a", "b", "c"]; // 문자
      let mix = [45, "sss", true, [1, 2, 3], { name: "김하진" }];
      console.log(nums);
      console.log(str);
      console.log(mix);
      console.log(nums.length);
      console.log(str.length);
      console.log(mix.length);

      console.log(mix[3]);
      console.log(mix[4]);

      // 1. property : length
      // 2. 내장함수 : .....push() => 가장 마지막에 새로운 데이터를 추가
      nums.push(100); // 매개변수(parameter)
      console.log(nums);
      nums.pop(100); // push의 반대는 pop
      console.log(nums);

      // 3. 수정 : 인덱스로 접근
      nums[5] = 98;
      console.log(nums);

      // 4. ?
      let x = [];
      console.log(x.length);
      x[0] = 1;
      console.log(x);
      x[2] = 3;
      console.log(x);
      x.push(3);
      console.log(x);
      x.push(7);
      console.log(x); // [1, empty, 3, 3, 7]

      // 5. 배열의 활용
      // 객체와 함께 활용, 예를 들어 개발한 시스템에서 (일부)사용자 목록을 읽어와 처리를 할 경우
      // let userList = [{}, {}, {}.......];
      let userList = [
        {
          name: "정국",
          gender: "남자",
          email: "jung@gmail.com",
          phone: "000-1111-1111",
        },
        {
          name: "뷔",
          gender: "남자",
          email: "vui@gmail.com",
          phone: "000-2222-1111",
        },
        {
          name: "로제",
          gender: "여자",
          email: "rose@gmail.com",
          phone: "000-333-1111",
        },
      ];
      console.log(userList[2]); // 로제 정보 출력
      console.log(userList[0].phone); // 000-1111-1111 정국 전화번호 출력
    </script>
  </body>
</html>
