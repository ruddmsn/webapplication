<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>가위바위보 게임</title>
  </head>
  <body>
    <script src="./js/common.js"></script>
    <button onclick="srpgame('가위')">가위</button>
    <button onclick="srpgame('바위')">바위</button>
    <button onclick="srpgame('보')">보</button>
    <script>
      const arr = ["가위", "바위", "보"];

      function srpgame(user) {
        const random = getRandomInteger(0, 2);
        const computer = arr[random];

        console.log("사용자 : " + user);
        console.log("컴퓨터 : " + computer);

        if (user === computer) {
          console.log("무승부");
        } else if (
          (user === "가위" && computer === "보") ||
          (user === "바위" && computer === "가위") ||
          (user === "보" && computer === "바위")
        ) {
          console.log("인간 승리");
        } else {
          console.log("컴퓨터 승리");
        }
      }
    </script>
  </body>
</html>
