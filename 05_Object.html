<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /* 객체
      - 관련있는 데이터를 하나로 담을 수 있는 데이터 타입
      - 파이썬의 딕셔너리와 유사
      - 순서를 보장하지 않는다 (ES6부터는 보장하려고 노력한다)
      - { }
      - {키(key) : 값(value)} => 키에 숫자가 올 수 없다
      - 값 : 
      - 키는 유일해야 한다 =. 오류X, 덮어쓰기 */

      // 1. 객체의 작성
      let student = {
        name: "강태인",
        age: 16,
        phone: "010-1111-2222",
        address: "서울 관악구",
        age: 28,
      };
      console.log(student);

      // 2. 키에 숫자가 올 경우
      let person = {
        111: "처음수",
        222: "두번째 수",
      };
      console.log(person);

      // 3. 키 값을 가져오기 => Object.keys() => 배열로 리턴
      let keys = Object.keys(person);
      console.log(keys);
      console.log(keys[0], keys[1]);
      console.log(keys[0] + keys[1]);

      // 4. 값에 접근하기
      let name = student.name;
      console.log(name); // 변수 scope : { } var는 변수를 통과해버려서 지향

      // 5. 객체를 생성하는 다른 방법
      let person2 = {}; // 빈 객체를 하나 만들고
      person2.name = "유재석";
      person2.age = 50; // 밖에서 값을 넣어준다
      console.log(person2);

      // 매우 중요!!!
      // 6. 특정 키에 접근하는 방법
      // 뭐가 들어올 지 모르는 경우 어떻게 할지?
      console.log(student.name);
      console.log(student["name"]); // 어떤 값을 가져올지 명확하지 않은 상황

      let userInput = prompt("알고 싶은 내용은?(name, age, phone, address)");
      console.log(student[userInput]);

      // 7. 객체의 값을 변경 시
      student.name = "김세부";

      // 8. 만약 존재하지 않는 키에 접근하려고 하면?
      console.log(student.number); // 실행결과 undefined
    </script>
  </body>
</html>
