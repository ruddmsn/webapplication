    <script>
      let str = "Welcome Seoul";

      // 1. property(속성) : length
      console.log(str.length);

      // 처음 나오는 것만 => ???

      console.log(str.indexOf("Jeju")); // -1 : 없다

      let tel = "010-0000-1111";

      // 3. lastIndexOf : 뒤에서부터 문자열을 찾아서 리턴
      str = "Welcome Seoul";
      console.log(str.lastIndexOf("Seoul")); // 8
      str = "Welcome Seoul Seoul";
      console.log(str.lastIndexOf("Seoul")); // 14

      // 4. ****slice() : 문자열을(시작위치, 마지막 위치 -1)까지 잘라내기
      str = "Welcome Seoul";
      console.log(str.slice(8, 13)); // Seoul
      console.log(str.slice(8)); // Seoul(8뒤로 전부 다)
      console.log(str.slice(8, 2)); // 안나옴
      // 서울의 인덱스를 모를 경우
      console.log(str.slice(str.indexOf("Seoul"))); // Seoul
      console.log(str.slice(-8)); // me Seoul(마이너스가 붙으면 뒤에서부터 시작 -1 ~ -8)
      console.log(str.slice(-5, -1)); // Seou
      console.log(str.slice(-13)); // Welcome Seoul

      // 5. substring() : 문자열을(시작위치, 마지막 위치 -1)까지 잘라내기
      str = "Welcome Seoul";
      console.log(str.substring(8, 13)); // Seoul
      console.log(str.substring(8)); // Seoul
      console.log(str.substring(8, 2)); // lcome => 오동작
      console.log(str.slice(-8)); // Welcome Seoul
      console.log(str.slice(-5, -1));
      console.log(str.slice(-13)); // Welcome Seoul

      // 6. substr() : 문자열을(시작위치, 길이)까지 잘라내기
      let now = "20260421";
      let year = now.substr(0, 4);
      console.log(year + "년");
      let month = now.substr(4, 2);
      console.log(year + "월");
      let date = now.substr(7, 2);
      console.log(year + "일");

      왜 유사한 함수를 많이 만들어 두었을까? 생각해보자.
      *****slice vs  substring vs  substr
      *slice : 가장 유연하고 현대적인 메서드, 음수처리 가능
      substring : slice와 유사하지만 인덱스가 음인 경우 처리가 다르다
      substr : 인덱스가 아닌 글자 수를 기준으로 하지만 현재 웹표준으로 권장하지 않는다. */

      // 7. **replace(str1, str2) : str1을 str2로 교체하는 내장 함수
      str = "Welcome Jeju! Jeju";
      console.log(str.replace("Jeju", "Seoul")); // Welcome Seoul! Jeju
      console.log(str);
      console.log(str.replace("Jeju", "Seoul")); // Welcome Seoul! Jeju

      // 8. **toUpperCase() : 대문자로 변환
      str = "Welcome Jeju! Jeju";
      console.log(str.toUpperCase);
      // 9. **toLowerCase() : 소문자로 변환
      console.log(str.toLowerCase);
      // 활용 : 사용자는 다양하게 입력하게 되므로 입력된 내용을 대(소)문자로 변환하면 된다.

      // 10. concat() : 여러 문자열 합치기, 갯수 제한 X
      let firstName = "John";
      let lastName = "Bacon";
      let fullName = firstName.concat("Mr", " ", lastName);
      console.log(fullName);

      // 11. trim() : 문자열의 앞 뒤 공백을 모두 제거
      let name = "    2학년   2반   ";
      console.log(name.trim());

      // 12. *****padStrat(문자열 전체 길이, 앞에 채울 문자열) : 특정한 문자열을 앞에 채운다.
      // 예를 들어 달(month)을 표현시 01, 02, 03...12 이렇게 두 글자 포맷을 유지하고 싶다면.. 사용
      // 현업에서 매우 많이 사용
      month = 4;
      // 월이 한자리이면 두자리로 표현하도록 코드를 작성
      // if (month.length < 2) {
      //   month = "0" + month;
      // }
      // console.log(month);
      console.log(month.padStart(2, 8));

      // 13. padEnd(문자열 전체 길이, 뒤에 채울 문자열) : 거의 사용하지 않는다.
      let studentNumber = "2201";
      console.log(studentNumber.padEnd(5, "5"));

      // 14. *charAt(인덱스) : 인덱스에 해당하는 글자 하나를 리턴
      studentNumber = "s2201";
      if (studentNumber.charA(0).toLowerCase === "s") {
        console.log("학생입니다.");
      }

      // 15. charCodeAt(인덱스) : 인덱스에 해당하는 글자의 유니코드 값을 리턴
      str = "A";
      console.log(str.charCodeAt(0)); // 65

      // **********16. split() : 파라미터로 전달받은 값을 기본으로 문자열을 쪼개서 리턴한다.
      let email =
        "john@gamil.com,jane@gamil.com,hong@gamil.com, kim@gamil.com, lee@gamil.com";
      let emails = emails.split(",");
      console.log(email);

      // 17. ***startsWith() : 파라미터로 시작하는 여부를 boolean으로 판단
      // https://
      let url = "websdite.com";
      if (url.slice(0, 8) === "https://" || url.slice(0, 7) === "https://") {
        console.log("유효한 주소입니다.");
      } else {
        console.log("유효하지 않는 주소입니다.");
      }

        console.log("유효한 주소입니다.");
      } else {
        console.log("유효하지 않는 주소입니다.");
      }

      // 18. endsWith : 파라미터로 종료하는지 여부를 boolean으로 변환
      url = "websdite.com";
      console.log(url.endsWith("com"));
