<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      // 다음은 좋아하는 음식을 단답형으로 입력하는 설문 조사 => 중복된 요소 제거
      // 사용자가 입력한 음식 종류를 저장한 배열 foods
      let foods = ['냉면', '김밥', '옥수수', '연어', '떡볶이', '족발', '김밥'];

      // 1. 제거
      let uniqueFood = []; // ['냉면', '김밥', '옥수수', '연어', '떡볶이', '족발', '김밥']
      for (food of foods) {
        if (uniqueFood.indexOf(food) === -1) {
          uniqueFood.push(food); 
        }
      }

      console.log(uniqueFood); // ['냉면', '김밥', '옥수수', '연어', '떡볶이', '족발']

      // 2. filter를 이용해 배열에서 조건에 맞는 것을 추출

      foods = ['냉면', '김밥', '옥수수', '연어', '떡볶이', '족발', '김밥'];

      foods.filter((food) => {
        if (!uniqueFood.includes(food)) uniqueFood.push(food);
      });
      console.log(uniqueFood); // ['냉면', '김밥', '옥수수', '연어', '떡볶이', '족발']

      // 3. new Set(), add()함수
      let uniqueFood2 = new Set();
      uniqueFood2.add('냉면');
      uniqueFood2.add('치킨');
      uniqueFood2.add('피자');
      uniqueFood2.add('치킨');
      uniqueFood2.add('파스타');
      uniqueFood2.add('족발');

      console.log(uniqueFood2); // Set(5) {'냉면', '치킨', '피자', '파스타', '족발'}

      // 4. has()
      console.log(uniqueFood2.has('김밥')); // false

      // 5. delete()
      console.log(uniqueFood2.delete('파스타')); // true
      console.log(uniqueFood2); // Set(4) {'냉면', '치킨', '피자', '족발'}

      // 6. clear()
      uniqueFood2.clear();
      console.log(uniqueFood2); // Set(0) {size: 0}
    </script>
  </body>
</html>
