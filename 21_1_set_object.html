<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      /* - 실무에서 set을 가장 유용하게 사용하는 경우는 "데이터의 중복을 허용하지 않으면서 특정
           특정 데이터가 존재하는지 빠른 속도로 찾아내야 하는 경우"
         - 대표적인 예시로는 '최근 본 상품 목록(중복제거)', 찜한 상품 실시간 활성화 여부 체크 */

      const recentView = new Set();
      const wishList = new Set();

      // 1. 본 상품을 최근 본 상품 목록에 추가하는 함수
      const addrecentView = (productId) => {
        recentView.add(productId);
      };

      addrecentView("스피커");
      addrecentView("아이폰 18프로");
      addrecentView("스피커");
      addrecentView("아이폰 18프로");
      addrecentView("아이폰 18프로");
      addrecentView("아이폰 18프로");

      console.log(recentView); // Set(2) {'스피커', '아이폰 18프로'}
      // 배열로 변환해서 출력
      recentViewArray = [...recentView]; // spread operator
      console.log([...recentView]); // (2) ['스피커', '아이폰 18프로']

      // 장바구니에서 선택, 해제하는 함수
      const toggleWishList = (productId) => {
        if (wishList.has(productId)) {
          wishList.delete(productId);
          console.log(`${productId} 찜 해제 `);
          console.log(wishList);
        } else {
          wishList.add(productId);
          console.log(`${productId} 찜 추가 `);
          console.log(wishList);
        }
      };
      wishList.add("아이폰");
      wishList.add("맥립글로스");
      wishList.add("맥북");
      console.log(wishList); // Set(3) {'아이폰', '맥립글로스', '맥북'}
      // 배열로 변환해서 출력
      console.log([...wishList]); // (3) ['아이폰', '맥립글로스', '맥북']

      toggleWishList("아이폰"); // Set(2) {'맥립글로스', '맥북'}

      toggleWishList("블루투스 스피커"); // Set(3) {'맥립글로스', '맥북', '블루투스 스피커'}
    </script>
  </body>
</html>
